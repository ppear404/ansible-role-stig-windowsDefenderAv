# SPDX-License-Identifier: MIT-0
---

- name: V-278656 | configure local administrator merge behavior for lists
  tags:
    - V-278656
    - CAT2
  when:
    - "'V-278656' not in stig_win_defender_antivirus_exceptions"
  ansible.builtin.set_fact:
    stig_win_defender_antivirus_policy: >-  # noqa: var-naming[no-role-prefix]
      {{ stig_win_defender_antivirus_policy + stig_win_defender_antivirus_entries }}
  vars:
    stig_win_defender_antivirus_entries:  # noqa: var-naming[no-role-prefix]
      - path: 'SOFTWARE\Policies\Microsoft\Windows Defender'
        name: 'DisableLocalAdminMerge'
        type: DWord
        data: 1

